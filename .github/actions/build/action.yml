name: 'build & push image'
description: 'Builds one Panasaurus image from a matrix entry and pushes it to GHCR'

inputs:
  image:
    description: 'JSON object of the matrix entry (name, context, file, platforms, tags)'
    required: true
  revision:
    description: 'Git revision used for OCI labels'
    required: true
  github_token:
    description: 'GitHub token for GHCR authentication'
    required: true

runs:
  using: composite
  steps:
    - name: set up QEMU
      if: contains(fromJSON(inputs.image).platforms, 'arm64')
      uses: docker/setup-qemu-action@v3
      with:
        image: tonistiigi/binfmt:qemu-v8.1.5-31

    - name: set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.github_token }}

    - name: compute tags & labels
      id: meta
      env:
        IMAGE_JSON: ${{ inputs.image }}
        REVISION: ${{ inputs.revision }}
      shell: bash
      run: |
        {
          echo "tags<<EOF"
          jq -r '.tags[]' <<< "$IMAGE_JSON"
          echo "EOF"
          echo "labels<<EOF"
          echo "org.opencontainers.image.revision=${REVISION}"
          echo "org.opencontainers.image.version=$(jq -r '.name' <<< "$IMAGE_JSON")"
          echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: build & push
      uses: docker/build-push-action@v6
      with:
        context: ${{ format('./{0}', fromJSON(inputs.image).context) }}
        file: ${{ fromJSON(inputs.image).file }}
        platforms: ${{ join(fromJSON(inputs.image).platforms, ',') }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=build-${{ fromJSON(inputs.image).name }}
        cache-to: type=gha,scope=build-${{ fromJSON(inputs.image).name }},mode=max

    - name: record build in job summary
      shell: bash
      env:
        IMAGE_JSON: ${{ inputs.image }}
      run: |
        {
          echo "| image | tags | platforms |"
          echo "|---|---|---|"
          echo "| `$(jq -r '.name' <<< "$IMAGE_JSON")` | $(jq -r '.tags | join(", ")' <<< "$IMAGE_JSON") | `$(jq -r '.platforms | join(", ")' <<< "$IMAGE_JSON")` |"
        } >> "$GITHUB_STEP_SUMMARY"
